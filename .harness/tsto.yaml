pipeline:
  name: STO Security Demo
  identifier: sto_security_demo
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+variable.GITHUB_CONNECTOR>
        repoName: <+variable.REPO_NAME>
        build: <+input>
  stages:
    - stage:
        name: Security Scan
        identifier: security_scan
        description: OWASP and SCA scans run in parallel before build
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - parallel:
                  - step:
                      type: Owasp
                      name: OWASP Dependency Check
                      identifier: owasp_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        resources:
                          limits:
                            memory: 4Gi
                  - step:
                      type: OsvScanner
                      name: SCA Vulnerability Scan
                      identifier: sca_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                          baseline: main
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
              - step:
                  type: Run
                  name: Enforce Security Policy
                  identifier: enforce_security_policy
                  spec:
                    shell: Sh
                    command: |
                      echo "=========================================="
                      echo "   SECURITY POLICY ENFORCEMENT"
                      echo "=========================================="

                      # Get NEW vulnerability counts from STO output
                      NEW_CRITICAL=<+pipeline.stages.security_scan.spec.execution.steps.sca_scan.output.outputVariables.NEW_CRITICAL>NEW_HIGH=<+pipeline.stages.security_scan.spec.execution.steps.sca_scan.output.outputVariables.NEW_HIGH>
                      echo "New Critical: $NEW_CRITICAL"
                      echo "New High: $NEW_HIGH"

                      # Fail only on NEW critical or high vulnerabilities
                      if [ "$NEW_CRITICAL" -gt 0 ]; then
                        echo "BLOCKED: $NEW_CRITICAL NEW critical vulnerabilities found!"
                        exit 1
                      fi

                      if [ "$NEW_HIGH" -gt 0 ]; then
                         echo "BLOCKED: $NEW_HIGH NEW high vulnerabilities found!"
                         exit 1
                      fi

                      echo "PASSED: No new critical/high vulnerabilities"
                      echo "=========================================="
                      echo "=========================================="
                      echo "   SECURITY SCAN RESULTS SUMMARY"
                      echo "=========================================="
                      echo ""
                      echo "OWASP Dependency Check: Completed"
                      echo "SCA Vulnerability Scan: Completed"
                      echo ""
                      echo "Review findings in Harness STO dashboard"
                      echo "Use AIDA for remediation guidance"
                      echo "=========================================="
    - stage:
        name: Build and Test
        identifier: build_test
        description: Demonstrates Test Intelligence - reduces 500+ tests to ~20
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build
                  identifier: build
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    shell: Sh
                    command: |
                      echo "=== Building Application ==="
                      echo "Project: Harness Demo Java App"
                      echo "Tests: 500+ unit and integration tests"
                      echo ""
                      mvn clean compile -DskipTests
                      echo ""
                      echo "=== Build Complete ==="
              - step:
                  type: RunTests
                  name: Run Tests with TI and Parallelism
                  identifier: run_tests
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    language: Java
                    buildTool: Maven
                    args: test -Dmaven.test.failure.ignore=true
                    runOnlySelectedTests: true
                    testAnnotations: org.junit.jupiter.api.Test
                    enableTestSplitting: true
                    preCommand: |
                      echo "=========================================="
                      echo "   TEST INTELLIGENCE ANALYZING..."
                      echo "=========================================="
                      echo ""
                      echo "Scanning code changes against test graph..."
                      echo "Identifying impacted tests..."
                      echo ""
                    postCommand: |
                      echo ""
                      echo "=========================================="
                      echo "   TEST EXECUTION COMPLETE"
                      echo "=========================================="
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "**/surefire-reports/*.xml"
                  strategy:
                    parallelism: 3
              - step:
                  type: Run
                  name: Package
                  identifier: package
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    shell: Sh
                    command: |
                      echo "=== Packaging Application ==="
                      mvn package -DskipTests
                      echo "=== Package Complete ==="
                      ls -la target/*.jar
