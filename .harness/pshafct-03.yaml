pipeline:
  name: Push Artifact to JFrog
  identifier: pshafct_03
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+variable.GITHUB_CONNECTOR>
        repoName: <+variable.REPO_NAME>
        build: <+input>
  stages:
    - stage:
        name: Build and Push
        identifier: build_and_push
        description: Build, scan, push to DockerHub, then publish to JFrog
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - parallel:
                  - step:
                      type: OsvScanner
                      name: SCA Vulnerability Scan
                      identifier: sca_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                          baseline: main
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                  - step:
                      type: Semgrep
                      name: SAST Scan
                      identifier: sast_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                          baseline: main
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        settings:
                          runner:
                            scan_settings:
                              policy: p/java
              - step:
                  type: RunTests
                  name: Run Tests with TI
                  identifier: run_tests
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    language: Java
                    buildTool: Maven
                    args: test -Dmaven.test.failure.ignore=true
                    runOnlySelectedTests: true
                    testAnnotations: org.junit.jupiter.api.Test
                    enableTestSplitting: true
                    preCommand: |
                      echo "=========================================="
                      echo "   TEST INTELLIGENCE ANALYZING..."
                      echo "=========================================="
                    postCommand: |
                      echo "=========================================="
                      echo "   TEST EXECUTION COMPLETE"
                      echo "=========================================="
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "**/surefire-reports/*.xml"
                  strategy:
                    parallelism: 3
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push to DockerHub
                  identifier: build_push_docker
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    repo: sidatks/harness-demo-java
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.branch>
                      - latest
                    dockerfile: Dockerfile
                    context: .
                    optimize: true
              - step:
                  type: Run
                  name: Publish to JFrog Artifactory
                  identifier: publish_to_jfrog
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: docker:24-cli
                    shell: Sh
                    command: |
                      echo "=========================================="
                      echo "   PUBLISHING TO JFROG ARTIFACTORY"
                      echo "=========================================="
                      echo ""

                      # Source image from DockerHub
                      SOURCE_IMAGE="sidatks/harness-demo-java:<+pipeline.sequenceId>"

                      # JFrog target registry
                      JFROG_REGISTRY="trial49t01l.jfrog.io"
                      TARGET_REPO="tieg-hrns-harness-demo-java"
                      BRANCH="<+codebase.branch>"

                      echo "Source: docker.io/${SOURCE_IMAGE}"
                      echo "Target: ${JFROG_REGISTRY}/${TARGET_REPO}"
                      echo "Branch: ${BRANCH}"
                      echo ""

                      # Login to JFrog Docker registry
                      echo "Logging into JFrog..."
                      echo "<+secrets.getValue("jfrog_token")>" | docker login ${JFROG_REGISTRY} -u "<+secrets.getValue("jfrog_username")>" --password-stdin

                      # Pull from DockerHub
                      echo "Pulling from DockerHub..."
                      docker pull ${SOURCE_IMAGE}

                      # Tag for JFrog with branch name and latest
                      echo "Tagging for JFrog..."
                      docker tag ${SOURCE_IMAGE} ${JFROG_REGISTRY}/${TARGET_REPO}:${BRANCH}
                      docker tag ${SOURCE_IMAGE} ${JFROG_REGISTRY}/${TARGET_REPO}:latest
                      docker tag ${SOURCE_IMAGE} ${JFROG_REGISTRY}/${TARGET_REPO}:<+pipeline.sequenceId>

                      # Push to JFrog
                      echo "Pushing to JFrog..."
                      docker push ${JFROG_REGISTRY}/${TARGET_REPO}:${BRANCH}
                      docker push ${JFROG_REGISTRY}/${TARGET_REPO}:latest
                      docker push ${JFROG_REGISTRY}/${TARGET_REPO}:<+pipeline.sequenceId>

                      echo ""
                      echo "=========================================="
                      echo "   PUBLISHED TO JFROG"
                      echo "=========================================="
                      echo "Images pushed to virtual repo: ${TARGET_REPO}"
                      echo "  - ${JFROG_REGISTRY}/${TARGET_REPO}:${BRANCH}"
                      echo "  - ${JFROG_REGISTRY}/${TARGET_REPO}:latest"
                      echo "  - ${JFROG_REGISTRY}/${TARGET_REPO}:<+pipeline.sequenceId>"
                      echo "=========================================="
                    privileged: true
              - step:
                  type: AquaTrivy
                  name: Aqua Trivy Container Scan
                  identifier: aqua_trivy_scan
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: container
                      detection: auto
                      name: sidatks/harness-demo-java
                      variant: <+pipeline.sequenceId>
                    advanced:
                      log:
                        level: info
                      fail_on_severity: none
                    privileged: true
                    image:
                      type: docker_v2
                      name: sidatks/harness-demo-java
                      tag: <+pipeline.sequenceId>
                      domain: docker.io
              - step:
                  type: Run
                  name: Pipeline Summary
                  identifier: pipeline_summary
                  spec:
                    shell: Sh
                    command: |
                      echo "=========================================="
                      echo "   PIPELINE EXECUTION SUMMARY"
                      echo "=========================================="
                      echo ""
                      echo "Source Code Scans:"
                      echo "  - SCA Scan (OSV): Completed"
                      echo "  - SAST Scan (Semgrep): Completed"
                      echo ""
                      echo "Build & Test:"
                      echo "  - Tests: Completed with Test Intelligence"
                      echo "  - Docker Build: Completed (multi-stage)"
                      echo ""
                      echo "Container Scan:"
                      echo "  - Aqua Trivy: Completed"
                      echo ""
                      echo "Artifacts Published:"
                      echo "  DockerHub:"
                      echo "    - sidatks/harness-demo-java:<+pipeline.sequenceId>"
                      echo "    - sidatks/harness-demo-java:<+codebase.branch>"
                      echo "    - sidatks/harness-demo-java:latest"
                      echo ""
                      echo "  JFrog Artifactory:"
                      echo "    - trial49t01l.jfrog.io/tieg-hrns-harness-demo-java:<+codebase.branch>"
                      echo "    - trial49t01l.jfrog.io/tieg-hrns-harness-demo-java:latest"
                      echo "    - trial49t01l.jfrog.io/tieg-hrns-harness-demo-java:<+pipeline.sequenceId>"
                      echo ""
                      echo "Review findings in Harness STO dashboard"
                      echo "=========================================="
