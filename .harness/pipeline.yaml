pipeline:
  name: Java Test Intelligence Demo
  identifier: java_ti_demo
  projectIdentifier: ci_demo
  orgIdentifier: demo_org
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.github_connector
        repoName: harness-demo-java
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: build_test
        description: "Demonstrates Test Intelligence - reduces 500+ tests to ~20"
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesHosted
            spec:
              identifier: harness_cloud
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Build
                  identifier: build
                  spec:
                    connectorRef: account.dockerhub
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: |
                      echo "=== Building Application ==="
                      echo "Project: Harness Demo Java App"
                      echo "Tests: 500+ unit and integration tests"
                      echo ""
                      mvn clean compile -DskipTests
                      echo ""
                      echo "=== Build Complete ==="

              - step:
                  type: RunTests
                  name: Run Tests with Intelligence
                  identifier: run_tests
                  spec:
                    connectorRef: account.dockerhub
                    image: maven:3.9-eclipse-temurin-17
                    language: Java
                    buildTool: Maven
                    args: test
                    runOnlySelectedTests: true
                    testAnnotations: org.junit.jupiter.api.Test
                    preCommand: |
                      echo "=========================================="
                      echo "   TEST INTELLIGENCE ANALYZING..."
                      echo "=========================================="
                      echo ""
                      echo "Scanning code changes against test graph..."
                      echo "Identifying impacted tests..."
                      echo ""
                    postCommand: |
                      echo ""
                      echo "=========================================="
                      echo "   TEST EXECUTION COMPLETE"
                      echo "=========================================="
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "**/surefire-reports/*.xml"
                    enableTestSplitting: false

              - step:
                  type: Run
                  name: Package
                  identifier: package
                  spec:
                    connectorRef: account.dockerhub
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: |
                      echo "=== Packaging Application ==="
                      mvn package -DskipTests
                      echo "=== Package Complete ==="
                      ls -la target/*.jar
