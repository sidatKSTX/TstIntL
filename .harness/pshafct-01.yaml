pipeline:
  name: Push Artifact Pipeline
  identifier: pshafct_01
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+variable.GITHUB_CONNECTOR>
        repoName: <+variable.REPO_NAME>
        build: <+input>
  stages:
    - stage:
        name: Build and Push
        identifier: build_and_push
        description: Build, test, scan, and push Docker image and artifact
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - parallel:
                  - step:
                      type: OsvScanner
                      name: SCA Vulnerability Scan
                      identifier: sca_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                          baseline: main
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                  - step:
                      type: Run
                      name: Enforce Security Policy
                      identifier: enforce_security_policy
                      spec:
                        shell: Sh
                        command: |
                          echo "=========================================="
                          echo "   SECURITY POLICY ENFORCEMENT"
                          echo "=========================================="

                          # Get NEW vulnerability counts from STO output
                          NEW_CRITICAL="<+pipeline.stages.build_and_push.spec.execution.steps.sca_scan.output.outputVariables.NEW_CRITICAL>"
                          NEW_HIGH="<+pipeline.stages.build_and_push.spec.execution.steps.sca_scan.output.outputVariables.NEW_HIGH>"

                          echo "New Critical: $NEW_CRITICAL"
                          echo "New High: $NEW_HIGH"

                          # Fail only on NEW critical or high vulnerabilities
                          if [ "$NEW_CRITICAL" -gt 0 ]; then
                            echo "BLOCKED: $NEW_CRITICAL NEW critical vulnerabilities found!"
                            exit 1
                          fi

                          if [ "$NEW_HIGH" -gt 0 ]; then
                             echo "BLOCKED: $NEW_HIGH NEW high vulnerabilities found!"
                             exit 1
                          fi

                          echo "PASSED: No new critical/high vulnerabilities"
                          echo "=========================================="
              - step:
                  type: Run
                  name: Build
                  identifier: build
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    shell: Sh
                    command: |
                      echo "=== Building Application ==="
                      echo "Project: Harness Demo Java App"
                      echo "Tests: 500+ unit and integration tests"
                      echo ""
                      mvn clean compile -DskipTests
                      echo ""
                      echo "=== Build Complete ==="
              - step:
                  type: RunTests
                  name: Run Tests with TI and Parallelism
                  identifier: run_tests
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    language: Java
                    buildTool: Maven
                    args: test -Dmaven.test.failure.ignore=true
                    runOnlySelectedTests: true
                    testAnnotations: org.junit.jupiter.api.Test
                    enableTestSplitting: true
                    preCommand: |
                      echo "=========================================="
                      echo "   TEST INTELLIGENCE ANALYZING..."
                      echo "=========================================="
                      echo ""
                      echo "Scanning code changes against test graph..."
                      echo "Identifying impacted tests..."
                      echo ""
                    postCommand: |
                      echo ""
                      echo "=========================================="
                      echo "   TEST EXECUTION COMPLETE"
                      echo "=========================================="
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "**/surefire-reports/*.xml"
                  strategy:
                    parallelism: 3
              - parallel:
                  - step:
                      type: Semgrep
                      name: SAST Scan
                      identifier: sast_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                          baseline: main
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        settings:
                          runner:
                            scan_settings:
                              policy: p/java
                  - step:
                      type: Sonarqube
                      name: SonarQube Code Quality
                      identifier: sonarqube_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                          baseline: main
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
                        auth:
                          access_token: <+secrets.getValue("sonarqube_token")>
                          domain: <+variable.SONARQUBE_URL>
                        tool:
                          project_key: <+variable.SNR_PRJCT_KEY>
              - step:
                  type: Run
                  name: Package
                  identifier: package
                  spec:
                    connectorRef: <+variable.DOCKER_CONNECTOR>
                    image: <+variable.MAVEN_IMAGE>
                    shell: Sh
                    command: |
                      echo "=== Packaging Application ==="
                      mvn package -DskipTests
                      echo "=== Package Complete ==="
                      ls -la target/*.jar
                      echo ""
                      echo "Artifact: target/test-intelligence-demo-1.0.0.jar"
              - parallel:
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and Push Docker Image
                      identifier: build_push_docker
                      spec:
                        connectorRef: <+variable.DOCKER_CONNECTOR>
                        repo: sidatkstx/harness-demo-java
                        tags:
                          - <+pipeline.sequenceId>
                          - latest
                        dockerfile: Dockerfile
                        context: .
                        optimize: true
                  - step:
                      type: Run
                      name: Publish Artifact
                      identifier: publish_artifact
                      spec:
                        connectorRef: <+variable.DOCKER_CONNECTOR>
                        image: <+variable.MAVEN_IMAGE>
                        shell: Sh
                        command: |
                          echo "=========================================="
                          echo "   PUBLISHING ARTIFACT"
                          echo "=========================================="
                          echo ""
                          echo "Artifact ID: test-intelligence-demo"
                          echo "Group ID: com.harnessdemo"
                          echo "Version: 1.0.0-<+pipeline.sequenceId>"
                          echo ""
                          echo "JAR Location: target/test-intelligence-demo-1.0.0.jar"
                          ls -la target/*.jar
                          echo ""
                          echo "=========================================="
                          echo "   ARTIFACT DETAILS"
                          echo "=========================================="
                          echo "Build Number: <+pipeline.sequenceId>"
                          echo "Commit SHA: <+codebase.commitSha>"
                          echo "Branch: <+codebase.branch>"
                          echo "=========================================="
              - step:
                  type: Run
                  name: Pipeline Summary
                  identifier: pipeline_summary
                  spec:
                    shell: Sh
                    command: |
                      echo "=========================================="
                      echo "   PIPELINE EXECUTION SUMMARY"
                      echo "=========================================="
                      echo ""
                      echo "SCA Scan: Completed"
                      echo "Build: Completed"
                      echo "Tests: Completed with Test Intelligence"
                      echo "SAST Scan: Completed"
                      echo "SonarQube: Completed"
                      echo "Package: Completed"
                      echo ""
                      echo "Docker Image: sidatkstx/harness-demo-java:<+pipeline.sequenceId>"
                      echo "Artifact: test-intelligence-demo-1.0.0-<+pipeline.sequenceId>.jar"
                      echo ""
                      echo "Review findings in Harness STO dashboard"
                      echo "Use AIDA for remediation guidance"
                      echo "=========================================="
